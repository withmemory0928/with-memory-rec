<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<title>위드메모리 · 녹음하기</title>
<meta property="og:title" content="위드메모리 · 녹음하기">
<meta property="og:description" content="질문을 보시고 목소리로 편하게 답을 남겨 주세요.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<style>
:root{--white:#FFFFFF;--cream:#FBF5EE;--brown:#A0482C;--brown-dk:#8A3D24;--ink:#2B2622;--sub:rgba(43,38,34,.66);--line:rgba(43,38,34,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--white)}
body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;line-height:1.7;word-break:keep-all;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
p{margin:0}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
/* 위 막대 */
.top{position:sticky;top:0;z-index:5;background:var(--white);padding-top:env(safe-area-inset-top)}
.bar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.back{width:48px;height:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:8px}
.back:disabled{opacity:.3}
.cnt{font-size:15px;font-weight:600;color:var(--sub)}
.prog{height:4px;background:var(--cream);margin:0 24px;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--brown);border-radius:2px;transition:width .3s}
/* 화면 */
.screen{flex:1;padding:32px 24px 24px}
.eyebrow{font-size:15px;font-weight:600;color:var(--brown)}
.h{font-size:26px;line-height:1.45;font-weight:600;margin-top:8px}
.d{font-size:16px;line-height:1.7;color:var(--sub);margin-top:16px;white-space:pre-line}
.who{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:16px;background:var(--cream);color:var(--brown);font-size:14px;font-weight:600;margin-bottom:16px}
.facts{margin-top:32px;border-top:1px solid var(--line)}
.fact{display:flex;justify-content:space-between;align-items:center;min-height:56px;border-bottom:1px solid var(--line);font-size:16px;gap:16px}
.fact b{font-weight:600;text-align:right}
.chk{margin-top:24px;display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--cream);border-radius:8px;font-size:16px;line-height:1.6;cursor:pointer}
.chk input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--brown);background:var(--white);display:flex;align-items:center;justify-content:center;margin-top:1px}
.chk input:checked+.box{background:var(--brown)}
.chk input:checked+.box svg{display:block}
.box svg{display:none}
.hint{margin-top:16px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;font-size:15px;line-height:1.6;color:var(--sub)}
/* 질문 */
.q{font-size:26px;line-height:1.45;font-weight:600;margin-top:8px}
.rec{display:flex;flex-direction:column;align-items:center;margin-top:48px}
.timer{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.2}
.timer small{font-size:16px;color:var(--sub);font-weight:500;margin-left:8px}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:64px;margin:16px 0 24px}
.wave i{display:block;width:4px;height:6px;border-radius:2px;background:var(--brown);transition:height .08s}
.mic{width:112px;height:112px;border-radius:50%;border:1px solid var(--brown);background:var(--brown);color:var(--white);display:flex;align-items:center;justify-content:center}
.mic svg{width:44px;height:44px}
.mic.on{background:var(--white);color:var(--brown)}
.mic.on svg{width:36px;height:36px}
.mic:disabled{opacity:.4}
.lbl{font-size:17px;font-weight:600;margin-top:16px}
.lbl-s{font-size:15px;color:var(--sub);margin-top:4px}
.tip{font-size:15px;line-height:1.6;color:var(--sub);margin-top:32px;text-align:center;white-space:pre-line}
.note-s{font-size:14px;line-height:1.6;color:var(--sub);margin-top:16px}
.state{font-size:16px;line-height:1.6;margin-top:16px;text-align:center;white-space:pre-line;color:var(--sub)}
.state.err{color:var(--brown);font-weight:600}
.saved{margin-top:40px}
.player{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:16px}
.play{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--cream);color:var(--brown);display:flex;align-items:center;justify-content:center}
.track{flex:1;height:4px;background:var(--cream);border-radius:2px;position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--brown)}
.tm{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.ok{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--brown);margin-top:24px}
.redo{margin-top:16px;border:0;background:transparent;padding:8px 0;font-size:16px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.retry{margin-top:16px;height:48px;padding:0 24px;border-radius:8px;border:1px solid var(--brown);background:var(--white);color:var(--brown);font-size:16px;font-weight:600}
/* 사진 */
.pframe{width:100%;border:0;display:block;height:520px;margin-top:24px}
/* 아래 고정 버튼 */
.foot{position:sticky;bottom:0;background:var(--white);padding:12px 24px calc(16px + env(safe-area-inset-bottom))}
.msg{font-size:15px;line-height:1.6;font-weight:600;color:var(--brown);background:var(--cream);border-radius:8px;padding:12px 16px;margin-bottom:12px}
.row{display:flex;gap:8px}
.btn{flex:1;height:56px;border-radius:8px;border:1px solid var(--brown);font-size:17px;font-weight:600;background:var(--white);color:var(--brown)}
.btn.main{background:var(--brown);color:var(--white)}
.btn.main:active{background:var(--brown-dk)}
.btn:disabled{opacity:.4}
.btn.ghost{flex:0 0 auto;border-color:transparent;color:var(--sub);padding:0 16px}
/* 제출 확인 · 완료 */
.dim{position:fixed;inset:0;background:rgba(43,38,34,.48);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--white);border-radius:24px 24px 0 0;padding:8px 24px calc(24px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 24px}
.sheet h2{font-size:22px;font-weight:600;line-height:1.45;margin:0}
.sum{margin:24px 0;border-top:1px solid var(--line)}
.sum div{display:flex;justify-content:space-between;gap:16px;min-height:52px;align-items:center;border-bottom:1px solid var(--line);font-size:16px}
.sum b{font-weight:600;text-align:right}
.sum .warn,.sum .warn b{color:var(--brown);font-weight:600}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 32px}
.ck{width:88px;height:88px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--brown)}
.end h1{font-size:26px;font-weight:600;line-height:1.45;margin:32px 0 0}
.end .d{margin-top:12px}
.end .card{margin-top:40px;width:100%;border:1px solid var(--line);border-radius:8px;padding:16px;text-align:left;font-size:15px;line-height:1.7}
.end .card b{font-weight:600}
.loading{padding:96px 24px;text-align:center;color:var(--sub);font-size:16px}
</style>
</head>
<body>
<div id="app"><p class="loading">불러오는 중이에요.<br>처음 여는 데는 몇 초 걸릴 수 있어요.</p></div>

<script>
(function () {
  // ▼ 새로 배포한 Apps Script 웹 앱 주소(/exec)를 넣으세요
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwOYpqH4WHzZRc4PXAws4k59ZnmiQjY0NKpz_I69WaUiE5xr9k5Zy57Jhfjy92jVixadg/exec';
  var MAX_SECS = 210;           // 최대 녹음 3분 30초
  var WARN_SECS = 180;          // 3분에 마무리 안내
  var MAX_LABEL = '3분 30초';
  var CONFIRM_TEXT = '남겨 주신 이야기가 책으로 만들어지는 데 쓰이는 것을 확인했어요.';
  var MIC_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
  var STOP_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  var CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
  var OK_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
  var PLAY_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
  var PAUSE_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  var BACK_SVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2622" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var app = $('#app');
  var token = (new URLSearchParams(location.hash.slice(1))).get('t') || (new URLSearchParams(location.search)).get('t') || '';
  var ptok = (new URLSearchParams(location.hash.slice(1))).get('p') || (new URLSearchParams(location.search)).get('p') || '';   // 사진 추가 편이면 사진키 (마지막 화면에 사진 칸)
  var pframe = null;
  function pw() { try { return pframe && pframe.contentWindow && pframe.contentWindow.wmPhoto; } catch (e) { return null; } }
  function photoConfirm() { if (!pframe) return; var w = pw(); if (w && w.confirm) w.confirm(); else if (!w || !w.done) setTimeout(photoConfirm, 500); }
  var info = null, active = null;
  var pending = {};
  var ctl = {};
  var ui = null;      // 위 막대·아래 버튼
  var cur = 0;        // 0 = 시작, 1..N = 질문, N+1 = 사진(사진 편만)

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmt(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function dl(ms) { var d = new Date(ms + 9 * 3600 * 1000); return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일 ' + ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2); }
  function nQ() { return info.questions.length; }
  function last() { return nQ() + (ptok ? 1 : 0); }

  // 마이크 오류 안내 — 기기에 맞는 방법 한 줄만 보여 줌
  function micHelp(e) {
    var nm = e && e.name, ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua), kakao = /KAKAOTALK/i.test(ua);
    if (nm === 'NotAllowedError' || nm === 'PermissionDeniedError')
      return '마이크 사용이 막혀 있습니다. 휴대폰 설정 → 앱 목록에서 ' + (kakao ? '카카오톡' : '사용하시는 인터넷 앱') + ' → 마이크를 켠 뒤 이 페이지를 다시 열어 주세요.';
    if (nm === 'NotFoundError') return '마이크를 찾지 못했습니다. 이어폰을 빼고 다시 눌러 주세요.';
    if (nm === 'NotReadableError') return '다른 앱이 마이크를 쓰고 있습니다. 통화나 다른 녹음을 끝낸 뒤 눌러 주세요.';
    return '녹음을 시작하지 못했습니다. ' + (kakao
      ? (ios ? "화면 아래 공유 버튼 → 'Safari로 열기'를 눌러 다시 열어 주세요." : "오른쪽 위 ⋮ → '다른 브라우저로 열기'를 눌러 다시 열어 주세요.")
      : '페이지를 새로고침한 뒤 다시 눌러 주세요. 계속 안 되면 카카오톡 채널로 알려 주세요.');
  }
  function call(body) {
    body.t = token;
    return fetch(EXEC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  function pickMime() {
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    var list = ['audio/mp4;codecs=mp4a.40.2', 'audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < list.length; i++) if (MediaRecorder.isTypeSupported(list[i])) return list[i];
    return '';
  }

  // 안내 화면 (오류·마감·완료). done이면 완료 표시와 다음 안내까지
  function simple(title, body, done) {
    app.textContent = ''; ui = null;
    var w = el('div', 'end');
    if (done) { var c = el('span', 'ck'); c.innerHTML = OK_SVG.replace('width="20" height="20"', 'width="44" height="44"'); w.appendChild(c); }
    w.appendChild(el('h1', '', title));
    if (body) w.appendChild(el('p', 'd', body));
    if (done) {
      var card = el('div', 'card'); card.appendChild(el('b', '', '이렇게 이어져요')); card.appendChild(el('br'));
      card.appendChild(document.createTextNode('남겨 주신 이야기는 속지로 정리해 ' + (info && info.name ? info.name + '님께' : '신청하신 분께') + ' 보내 드려요.'));
      w.appendChild(card);
    }
    app.appendChild(w);
    window.scrollTo(0, 0);
  }

  function start() {
    if (!token && ptok) return location.replace('photo.html?t=' + encodeURIComponent(ptok));   // 녹음 장이 없는 편: 사진 칸만 있는 페이지
    if (!token) return simple('주소를 확인해 주세요', '받으신 링크를 다시 눌러 주세요.');
    call({ action: 'info' }).then(function (r) {
      if (!r.ok && r.code === 'server') return simple('잠시 문제가 생겼습니다', '잠시 문제가 생겼습니다. 1~2분 뒤 새로고침해 주세요. 계속 안 되면 카카오톡 채널로 알려 주세요.');
      if (!r.ok) return simple('열 수 없는 주소입니다', '받으신 링크가 맞는지 확인해 주세요. 계속 열리지 않으면 신청하신 분께 문의해 주세요.');
      info = r; info.saved = info.saved || {};
      if (r.state === 'submitted') return simple('제출이 완료되었습니다', '녹음이 모두 전달되었습니다. 감사합니다.', true);
      if (r.state === 'closed') return simple('녹음 기간이 끝났습니다', '제출 기간이 지났습니다. 문의가 필요하시면 신청하신 분께 말씀해 주세요.');
      render();
    }).catch(function () { simple('불러오지 못했습니다', '인터넷 연결을 확인한 뒤 새로고침해 주세요.'); });
  }

  /* ───────── 화면 만들기 ───────── */
  function render() {
    app.textContent = '';
    var top = el('div', 'top');
    var bar = el('div', 'bar');
    var back = el('button', 'back'); back.type = 'button'; back.innerHTML = BACK_SVG; back.setAttribute('aria-label', '이전');
    var cnt = el('span', 'cnt'); var pad = el('span'); pad.style.width = '48px';
    bar.appendChild(back); bar.appendChild(cnt); bar.appendChild(pad); top.appendChild(bar);
    var pg = el('div', 'prog'); var pi = document.createElement('i'); pg.appendChild(pi); top.appendChild(pg);
    app.appendChild(top);

    var screens = [buildIntro()];
    info.questions.forEach(function (text, i) { screens.push(buildQ(i + 1, text)); });
    if (ptok) screens.push(buildPhoto());
    screens.forEach(function (s) { s.classList.add('hide'); app.appendChild(s); });

    var foot = el('div', 'foot');
    var fm = el('p', 'msg hide');
    var row = el('div', 'row');
    var skip = el('button', 'btn ghost', '건너뛰기'); skip.type = 'button';
    var next = el('button', 'btn main', '다음'); next.type = 'button';
    row.appendChild(skip); row.appendChild(next);
    foot.appendChild(fm); foot.appendChild(row);
    app.appendChild(foot);

    ui = { top: top, back: back, cnt: cnt, pi: pi, screens: screens, fm: fm, skip: skip, next: next };
    back.addEventListener('click', function () { if (active === null && cur > 0) go(cur - 1); });
    skip.addEventListener('click', function () { if (active === null) go(cur + 1); });
    next.addEventListener('click', onNext);
    if (info.confirmed) photoConfirm();
    go(0);
  }

  function buildIntro() {
    var s = el('div', 'screen');
    if (info.who) s.appendChild(el('span', 'who', info.who + '께'));
    var h = el('p', 'h'); h.style.marginTop = info.who ? '0' : '';
    h.textContent = (info.name ? info.name + '님이 고른 ' : '') + '질문 ' + nQ() + '개가 도착했어요';
    s.appendChild(h);
    s.appendChild(el('p', 'd', '질문을 하나씩 보며 편하게 말씀해 주세요. 한 질문에 2~3분이면 충분해요.'));
    var facts = el('div', 'facts');
    var addFact = function (k, v) { var f = el('div', 'fact'); f.appendChild(el('span', '', k)); f.appendChild(el('b', '', v)); facts.appendChild(f); };
    addFact('녹음할 질문', nQ() + '개');
    if (ptok) addFact('사진', '2장');
    addFact('마감', dl(info.deadline));
    s.appendChild(facts);
    var lb = el('label', 'chk');
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'confirm';
    var box = el('span', 'box'); box.innerHTML = CHECK_SVG;
    lb.appendChild(cb); lb.appendChild(box); lb.appendChild(el('span', '', CONFIRM_TEXT));
    s.appendChild(lb);
    if (info.confirmed) { cb.checked = true; cb.disabled = true; }
    cb.addEventListener('change', function () { paintFoot(); });
    var ua = navigator.userAgent;
    if (/KAKAOTALK/i.test(ua)) s.appendChild(el('p', 'hint', /iPhone|iPad|iPod/i.test(ua)
      ? '마이크 사용을 묻는 창이 뜨면 "허용"을 눌러 주세요. 녹음이 되지 않으면 화면 아래 공유 버튼에서 "Safari로 열기"를 눌러 주세요.'
      : '마이크 사용을 묻는 창이 뜨면 "허용"을 눌러 주세요. 녹음이 되지 않으면 오른쪽 위 ⋮ 버튼에서 "다른 브라우저로 열기"를 눌러 주세요.'));
    s.appendChild(el('p', 'note-s', '녹음은 질문마다 바로 저장돼서 나눠서 하셔도 돼요. 제출을 누르지 않으셔도 마감 때 저장된 ' + (ptok ? '녹음과 사진이' : '녹음이') + ' 자동으로 전달돼요.'));
    s.cb = cb;
    return s;
  }

  function buildQ(n, text) {
    var s = el('div', 'screen');
    s.appendChild(el('p', 'eyebrow', '질문 ' + n));
    s.appendChild(el('p', 'q', text));
    var rec = el('div', 'rec');
    var time = el('p', 'timer hide');

    });
  }

  // 화면이 다시 보일 때: 저장 중이던 녹음이 서버에 올라갔는지 확인해서 화면 상태를 맞춘다
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !info) return;
    var waiting = Object.keys(pending).filter(function (k) { return pending[k].status === 'uploading' || pending[k].status === 'failed'; });
    if (!waiting.length) return;
    call({ action: 'info' }).then(function (r) {
      if (!r || !r.ok) return;
      info.saved = r.saved || {};
      waiting.forEach(function (k) {
        var p = pending[k], n = +k, s = info.saved[k];
        if (s && s.secs === p.secs) {
          p.status = 'saved';
          ctl[n].retry.classList.add('hide');
          setSaved(n, p);
        } else if (p.status === 'uploading') {
          fail(n, p);
        }
      });
      syncMics(); updateProg();
    }).catch(function () {});
  });
  window.addEventListener('beforeunload', function (e) { if (busy()) { e.preventDefault(); e.returnValue = ''; } });
  start();
})();
</script>
</body>
</html>
