<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>위드메모리 · 녹음 테스트</title>
<style>
:root{--ink:#222;--sub:#5a5a5a;--line:#e3e0d8;--soft:#f7f5f0;--accent:#2f5d50;--accent-soft:#e7efea;--rec:#b03a2e}
*{box-sizing:border-box}
body{margin:0;background:var(--soft);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:19px;line-height:1.65;word-break:keep-all;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 56px}
.brand{font-size:15px;color:var(--accent);font-weight:700;letter-spacing:.04em;margin:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 18px;margin-bottom:16px}
h1{font-size:26px;line-height:1.35;margin:0 0 8px}
p{margin:10px 0}
.note{font-size:16px;color:var(--sub)}
.note.first{margin-top:0}
.q{font-size:21px;font-weight:700;margin:0 0 14px}
.q b{color:var(--accent);margin-right:6px}
.recbox{text-align:center;padding:8px 0 4px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.mic svg{width:42px;height:42px}
.mic.on{background:var(--rec);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(176,58,46,.45)}70%{box-shadow:0 0 0 18px rgba(176,58,46,0)}100%{box-shadow:0 0 0 0 rgba(176,58,46,0)}}
.state{font-size:18px;font-weight:600;margin:12px 0 2px}
.time{font-size:28px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--rec);min-height:40px}
audio{width:100%;margin:10px 0}
.row{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;font-size:20px;font-weight:700;padding:16px 10px;border-radius:12px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;font-family:inherit}
.btn.main{background:var(--accent);color:#fff}
.btn:disabled{opacity:.5}
.hide{display:none}
.msg{font-weight:600;border-radius:12px;padding:14px;margin:14px 0 0}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.msg.err{background:#fbeeec;color:var(--rec)}
.diag{font-size:13px;color:#666;background:var(--soft);border-radius:10px;padding:10px 12px;word-break:break-all;line-height:1.5;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap" id="wmrec">
  <p class="brand">WITH MEMORY · 위드메모리</p>
  <div class="card">
    <h1>녹음 테스트</h1>
    <p class="note">휴대폰에서 녹음과 저장이 잘 되는지 확인하는 페이지입니다. 동그란 버튼을 누르면 마이크 사용을 묻는 창이 뜹니다. <b>허용</b>을 눌러 주세요.</p>
    <p class="msg err hide" data-id="inapp"></p>
  </div>
  <div class="card">
    <p class="q"><b>Q.</b>오늘 아침에 무엇을 드셨나요?</p>
    <div class="recbox">
      <button class="mic" data-id="mic" type="button" aria-label="녹음 시작">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <p class="state" data-id="state">버튼을 눌러 녹음을 시작하세요</p>
      <p class="time" data-id="time"></p>
    </div>
    <div data-id="after" class="hide">
      <audio data-id="player" controls playsinline></audio>
      <div class="row">
        <button class="btn" data-id="redo" type="button">다시 녹음</button>
        <button class="btn main" data-id="save" type="button">저장하기</button>
      </div>
    </div>
    <p class="msg hide" data-id="msg"></p>
  </div>
  <div class="card">
    <p class="note first"><b>확인용 정보</b> (화면을 캡처해 보내 주세요)</p>
    <div class="diag" data-id="diag"></div>
  </div>
</div>
<script>
(function () {
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycby66wUV1lfk8PN2D3ZGsYXG95reBOJ0jjOUaIVnM50xXp4bUaW529moHvzzaEC0kc8/exec';
  var root = document.getElementById('wmrec');
  var $ = function (id) { return root.querySelector('[data-id="' + id + '"]'); };
  var ua = navigator.userAgent;
  var MAX_SECS = 600;
  var stream = null, rec = null, chunks = [], blob = null, mime = '', t0 = 0, timer = null, secs = 0;

  function pickMime() {
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    var list = ['audio/mp4;codecs=mp4a.40.2', 'audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < list.length; i++) if (MediaRecorder.isTypeSupported(list[i])) return list[i];
    return '';
  }

  var diag = [];
  function addDiag(k, v) { diag.push(k + ': ' + v); $('diag').textContent = diag.join('\n'); }
  addDiag('페이지', location.origin + location.pathname);
  addDiag('기기', ua);
  addDiag('마이크 기능', (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? '있음' : '없음');
  addDiag('녹음 기능', window.MediaRecorder ? '있음' : '없음');
  addDiag('녹음 형식(예정)', pickMime() || '브라우저 기본값');
  if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
    addDiag('지원 형식', ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/wav'].map(function (t) { return t + '=' + (MediaRecorder.isTypeSupported(t) ? 'O' : 'X'); }).join(', '));
  }

  if (/KAKAOTALK/i.test(ua)) {
    var ios = /iPhone|iPad|iPod/i.test(ua);
    $('inapp').textContent = '카카오톡 안에서 열렸습니다. 녹음이 되지 않으면 ' + (ios ? '화면 아래 공유 버튼에서 "Safari로 열기"' : '오른쪽 위 ⋮ 버튼에서 "다른 브라우저로 열기"') + '를 선택해 주세요.';
    $('inapp').classList.remove('hide');
  }

  function show(el, on) { el.classList[on ? 'remove' : 'add']('hide'); }
  function msg(text, ok) { var m = $('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); }
  function fmt(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }

  function errText(e) {
    var n = e && e.name;
    if (n === 'NotAllowedError' || n === 'PermissionDeniedError') return '마이크 사용이 허용되지 않았습니다. 휴대폰 설정에서 이 앱(브라우저)의 마이크를 허용한 뒤 다시 열어 주세요.';
    if (n === 'NotFoundError') return '마이크를 찾지 못했습니다.';
    if (n === 'SecurityError') return '이 화면에서는 마이크를 쓸 수 없도록 막혀 있습니다.';
    if (n === 'NotReadableError') return '다른 앱이 마이크를 쓰고 있습니다. 통화나 다른 녹음을 끝낸 뒤 다시 눌러 주세요.';
    return '녹음을 시작하지 못했습니다.';
  }

  function start() {
    $('msg').className = 'msg hide';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      msg('이 브라우저에서는 녹음을 할 수 없습니다. 다른 브라우저로 열어 주세요.', false);
      addDiag('오류', '녹음 기능 없음');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
      .then(function (s) {
        stream = s; chunks = [];
        var m = pickMime();
        rec = m ? new MediaRecorder(s, { mimeType: m }) : new MediaRecorder(s);
        rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
        rec.onstop = finish;
        rec.start(1000);
        t0 = Date.now(); secs = 0;
        $('mic').classList.add('on');
        $('mic').setAttribute('aria-label', '녹음 멈추기');
        $('state').textContent = '녹음 중입니다. 다 말씀하셨으면 버튼을 다시 눌러 주세요';
        $('time').textContent = '0:00';
        timer = setInterval(function () {
          secs = Math.floor((Date.now() - t0) / 1000);
          $('time').textContent = fmt(secs);
          if (secs >= MAX_SECS) stop();
        }, 250);
      })
      .catch(function (e) {
        msg(errText(e), false);
        addDiag('오류', (e && e.name) + ' / ' + (e && e.message));
      });
  }

  function stop() {
    if (rec && rec.state !== 'inactive') rec.stop();
    clearInterval(timer);
  }

  function finish() {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    mime = (rec && rec.mimeType) || (chunks[0] && chunks[0].type) || 'audio/webm';
    blob = new Blob(chunks, { type: mime });
    secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
    addDiag('실제 녹음 형식', mime + ' / ' + Math.round(blob.size / 1024) + 'KB / ' + secs + '초');
    $('player').src = URL.createObjectURL(blob);
    $('mic').classList.remove('on');
    $('mic').setAttribute('aria-label', '녹음 시작');
    show($('mic'), false);
    $('state').textContent = '녹음이 끝났습니다. 들어 보시고 저장해 주세요';
    $('time').textContent = fmt(secs);
    show($('after'), true);
  }

  $('mic').addEventListener('click', function () {
    if (rec && rec.state === 'recording') stop(); else start();
  });

  $('redo').addEventListener('click', function () {
    blob = null; $('player').removeAttribute('src');
    show($('after'), false); show($('mic'), true);
    $('state').textContent = '버튼을 눌러 녹음을 시작하세요';
    $('time').textContent = ''; $('msg').className = 'msg hide';
    $('save').disabled = false; $('redo').disabled = false;
    $('save').textContent = '저장하기';
  });

  $('save').addEventListener('click', function () {
    if (!blob) return;
    var btn = $('save');
    btn.disabled = true; $('redo').disabled = true;
    btn.textContent = '저장하는 중…';
    var r = new FileReader();
    r.onload = function () {
      var data = String(r.result).split(',')[1] || '';
      fetch(EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ data: data, mime: mime, ua: ua, secs: secs })
      })
        .then(function (res) { return res.json(); })
        .then(function (res) {
          if (!res || !res.ok) throw new Error((res && res.error) || '저장 실패');
          btn.textContent = '저장 완료';
          $('redo').disabled = false;
          msg('저장되었습니다. (' + res.name + ', ' + Math.round(res.size / 1024) + 'KB)', true);
          addDiag('저장', res.name + ' / ' + res.mime);
        })
        .catch(function (e) {
          btn.disabled = false; $('redo').disabled = false;
          btn.textContent = '저장하기';
          msg('저장하지 못했습니다. 잠시 후 다시 눌러 주세요.', false);
          addDiag('저장 오류', String(e && e.message ? e.message : e));
        });
    };
    r.onerror = function () { msg('파일을 읽지 못했습니다.', false); btn.disabled = false; $('redo').disabled = false; btn.textContent = '저장하기'; };
    r.readAsDataURL(blob);
  });
})();
</script>
</body>
</html>
