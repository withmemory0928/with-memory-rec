<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>위드메모리 · 웹책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
/* 위드메모리 웹책 — 밝은 톤 하나만 씀 (휴대폰이 다크 모드여도 그대로). 색은 download.html·form.html과 같은 갈색·베이지·흰색 */
:root{
  color-scheme:light;
  --bg:#f6f1ea;        /* 베이지 바탕 */
  --paper:#fffdf9;     /* 흰 종이 */
  --ink:#3b2f27;       /* 진갈색 글씨 */
  --muted:#7a6c60;
  --line:#e6dccf;
  --accent:#7a4a2c;    /* 갈색 */
  --accent2:#a0704f;
  --soft:#f3ebe0;
  --cover:#efe4d6;     /* 표지: 밝은 베이지 */
  --hl:rgba(160,112,79,.18);
  --shadow:0 1px 2px rgba(60,40,25,.06),0 8px 24px rgba(60,40,25,.08);
  --serif:'Noto Serif KR','AppleMyungjo',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --fs:18px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);overflow:hidden;word-break:keep-all;overflow-wrap:break-word;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));position:relative}
.bar{display:flex;align-items:center;gap:8px;min-height:44px}
.logo{height:11px;width:auto;color:var(--accent);flex:none}
.bar .count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;height:34px;min-width:34px;padding:0 12px;font-size:13px;cursor:pointer}
.icon-btn:hover{border-color:var(--accent2)}

.book{flex:1;position:relative;margin-top:8px;min-height:0}
.page{position:absolute;inset:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow-y:auto;overscroll-behavior:contain;padding:28px 22px 32px}
.page.enter-r{animation:inR .3s ease}.page.enter-l{animation:inL .3s ease}
@keyframes inR{from{transform:translateX(20px);opacity:.4}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-20px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.page.enter-r,.page.enter-l{animation:none}}

/* 표지 */
.page.cover{background:var(--cover);display:flex;flex-direction:column;padding:34px 28px}
.cover .frame{position:absolute;inset:12px;border:1px solid rgba(122,74,44,.25);border-radius:8px;pointer-events:none}
.cover .logo{height:12px}
.cover .spine{margin-top:auto;position:relative}
.cover .eyebrow{font-size:13px;letter-spacing:.1em;color:var(--accent2)}
.cover h1{font-family:var(--serif);font-weight:600;font-size:clamp(32px,9.5vw,42px);line-height:1.3;margin:14px 0 16px;color:var(--accent)}
.cover .sub{font-family:var(--serif);font-size:16px;line-height:1.7;color:var(--ink)}
.cover .meta{margin-top:26px;border-top:1px solid rgba(122,74,44,.2);padding-top:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;color:var(--muted)}
.cover .meta dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
.cover .open{margin-top:26px;align-self:flex-start;background:var(--accent);color:#fffdf9;border:0;border-radius:999px;padding:12px 24px;font-weight:700;cursor:pointer}

/* 차례 */
.toc h2,.end h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 6px;color:var(--accent)}
.lead{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.6}
.toc ol,.sheet ol{list-style:none;margin:0;padding:0}
.toc li button,.sheet li button{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 2px;display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:baseline;cursor:pointer}
.toc li:last-child button{border-bottom:1px solid var(--line)}
.no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.toc .q,.sheet .q{font-family:var(--serif);font-size:15.5px;line-height:1.5;min-width:0}
.kind{font-size:12px;color:var(--accent2);white-space:nowrap}
.edh{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;margin:18px 0 4px}
.edh:first-of-type{margin-top:0}

/* 질문 쪽 */
.qno{font-size:12px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.qtitle{font-family:var(--serif);font-weight:600;font-size:calc(var(--fs) + 5px);line-height:1.5;margin:10px 0 8px;color:var(--ink)}
.qmeta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:18px}
.answer{line-height:1.95;margin:0;white-space:pre-line}
.answer .s{border-radius:4px;transition:background .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.answer.click .s{cursor:pointer}
.answer.click .s:hover{background:var(--soft)}
.answer .s.on{background:var(--hl)}
.sign{margin-top:22px;text-align:right;font-family:var(--serif);font-size:14px;color:var(--muted)}

.player{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:20px}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fffdf9;cursor:pointer;display:grid;place-items:center}
.play svg{width:18px;height:18px;fill:currentColor}
.play[disabled]{opacity:.5;cursor:default}
.track{min-width:0}
.track .label{font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.track .label span{white-space:nowrap}.track .label span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.track .label span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar-bg{height:6px;background:var(--line);border-radius:3px;overflow:hidden;cursor:pointer}
.bar-fg{height:100%;width:0;background:var(--accent2);border-radius:3px}
.speed{border:1px solid var(--line);background:var(--paper);border-radius:999px;font-size:12px;padding:6px 10px;cursor:pointer;font-variant-numeric:tabular-nums}

.hand-img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:8px}
.photo{background:#fff;padding:10px 10px 12px;border-radius:4px;box-shadow:var(--shadow);border:1px solid var(--line);margin:6px 2px 22px}
.photo img{display:block;width:100%;height:auto;border-radius:2px}
.ph-wait{aspect-ratio:4/3;background:var(--soft);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:13px}

/* 마지막 쪽 */
.end p{line-height:1.8;margin:0 0 14px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 22px}
.stat div{background:var(--soft);border-radius:10px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:18px;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.small{font-size:13px;color:var(--muted);line-height:1.7}

.nav{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:12px}
.nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:18px;color:var(--accent)}
.nav button:disabled{opacity:.35;cursor:default}
.prog{display:grid;gap:5px}
.prog .t{font-size:12px;color:var(--muted);text-align:center}
.prog .b{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog .b i{display:block;height:100%;background:var(--accent2);width:0;transition:width .3s}

.sheet{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:56px;z-index:5;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;max-height:70%;overflow-y:auto}
.sheet h3{margin:0 0 10px;font-size:14px}
.sizes{display:flex;gap:8px}
.sizes button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 0;cursor:pointer;font-family:var(--serif)}
.sizes button[aria-pressed="true"]{border-color:var(--accent2);background:var(--soft);font-weight:600}

/* 비밀번호 */
.lockf{display:grid;gap:10px;margin-top:16px;text-align:left}
.lockf label{font-size:13px;font-weight:500;color:var(--ink)}
.lockf input{font:inherit;font-size:24px;letter-spacing:.5em;text-align:center;padding:10px 10px 10px 18px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
.lockf input:focus{outline:2px solid var(--accent2);outline-offset:1px}
.lockf .err{color:#b3261e;font-size:13px;min-height:1.2em;margin:0}
.btn{border:0;background:var(--accent);color:#fffdf9;border-radius:999px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:default}
.btn.line{background:var(--paper);color:var(--accent);border:1px solid var(--accent2)}
.pdfbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 18px;display:grid;gap:8px}
.pdfbox .small{margin:0}
/* 안내 화면 (불러오는 중 · 만료 · 오류) */
.msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px 16px;background:var(--bg);z-index:10}
.msg .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 22px;width:min(100%,380px);text-align:center}
.msg .logo{height:11px;margin:0 auto 16px;display:block}
.msg h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 10px;color:var(--accent)}
.msg p{margin:0;font-size:15px;color:var(--muted);line-height:1.7}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent2);border-radius:50%;margin:4px auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

      a.href = url; a.download = '위드메모리_' + ((D.call || '부모님') + '의 이야기') + '.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      msg.textContent = '내려받았어요. 휴대폰의 \'파일\' 또는 \'다운로드\'에서 찾을 수 있어요.';
    }).catch(function () { msg.textContent = DEMO ? '예시에는 PDF가 없어요.' : '받지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'; })
      .then(function () { b.disabled = false; });
  });

  /* ── 목소리 재생 (문장 강조는 길이 비율로 맞춤) ── */
  function setupPlayer(sec, fileIdx, sents) {
    var p = { sec: sec, i: fileIdx, audio: null, rate: 1,
      btn: sec.querySelector('.play'), fg: sec.querySelector('.bar-fg'), time: sec.querySelector('.time'), bar: sec.querySelector('.bar-bg'),
      spans: [].slice.call(sec.querySelectorAll('.answer .s')), speedBtn: sec.querySelector('.speed') };
    var acc = 0, total = 0;
    var lens = p.spans.map(function (s) { var n = s.textContent.replace(/\s/g, '').length; total += n; return n; });
    p.starts = lens.map(function (n) { var st = acc; acc += n; return total ? st / total : 0; });
    var known = D.files[fileIdx] && D.files[fileIdx].sec;
    if (known) p.time.textContent = '0:00 / ' + fmt(known);
    players.push(p);
    p.btn.onclick = function () { p.audio && !p.audio.paused ? p.audio.pause() : play(p); };
    p.speedBtn.onclick = function () { p.rate = p.rate === 1 ? 1.5 : p.rate === 1.5 ? 0.8 : 1; p.speedBtn.textContent = p.rate + '배'; if (p.audio) p.audio.playbackRate = p.rate; };
    p.spans.forEach(function (s, i) { s.onclick = function () { ready(p).then(function (a) { if (a.duration) a.currentTime = p.starts[i] * a.duration; play(p); }); }; });
    p.bar.onclick = function (e) { var r = p.bar.getBoundingClientRect(); ready(p).then(function (a) { if (a.duration) a.currentTime = (e.clientX - r.left) / r.width * a.duration; }); };
    p.bar.onkeydown = function (e) { if (!p.audio) return; if (e.key === 'ArrowRight') { p.audio.currentTime += 5; e.preventDefault(); } if (e.key === 'ArrowLeft') { p.audio.currentTime -= 5; e.preventDefault(); } };
  }
  function ready(p) {
    if (p.audio) return Promise.resolve(p.audio);
    p.btn.disabled = true; p.time.textContent = '불러오는 중…';
    return fileUrl(p.i).then(function (url) {
      var a = new Audio(url); a.preload = 'auto'; a.playbackRate = p.rate; p.audio = a;
      a.addEventListener('timeupdate', function () { render(p); });
      a.addEventListener('loadedmetadata', function () { render(p); });
      a.addEventListener('play', function () { p.btn.innerHTML = pauseIcon; p.btn.setAttribute('aria-label', '멈추기'); });
      a.addEventListener('pause', function () { p.btn.innerHTML = playIcon; p.btn.setAttribute('aria-label', '목소리 듣기'); });
      a.addEventListener('ended', function () { p.spans.forEach(function (s) { s.classList.remove('on'); }); });
      p.btn.disabled = false;
      return a;
    }).catch(function (e) { p.btn.disabled = false; p.time.textContent = DEMO ? '예시에는 녹음이 없어요' : '불러오지 못했어요. 다시 눌러 주세요'; throw e; });
  }
  function play(p) { players.forEach(function (o) { if (o !== p && o.audio) o.audio.pause(); }); ready(p).then(function (a) { a.play(); }).catch(function () {}); }
  function render(p) {
    var a = p.audio; if (!a) return;
    var dur = isFinite(a.duration) ? a.duration : 0, t = a.currentTime;
    p.fg.style.width = (dur ? t / dur * 100 : 0) + '%';
    p.time.textContent = fmt(t) + ' / ' + fmt(dur);
    var f = dur ? t / dur : 0, c = -1;
    for (var i = 0; i < p.starts.length; i++) if (f >= p.starts[i]) c = i;
    p.spans.forEach(function (s, i) { s.classList.toggle('on', t > 0 && i === c); });
  }

  /* ── 사진·손글씨는 그 쪽을 열 때 불러옴 ── */
  function loadImages(pg) {
    [].slice.call(pg.querySelectorAll('[data-img],[data-hand]')).forEach(function (el) {
      if (el.dataset.busy) return; el.dataset.busy = '1';
      var i = el.dataset.img != null ? el.dataset.img : el.dataset.hand, hand = el.dataset.hand != null;
      fileUrl(i).then(function (url) {
        var img = new Image(); img.src = url; img.alt = hand ? '손글씨 원본' : '부모님이 고른 사진';
        if (hand) img.className = 'hand-img';
        el.replaceWith(img);
      }).catch(function () { el.textContent = DEMO ? (hand ? '예시에는 손글씨 이미지가 없어요' : '예시에는 사진이 없어요') : '불러오지 못했어요. 쪽을 다시 열어 주세요'; delete el.dataset.busy; });
    });
  }

  /* ── 넘기기 ── */
  function go(i, dir) {
    if (i < 0 || i >= pages.length) return;
    players.forEach(function (o) { if (o.audio) o.audio.pause(); });
    pages[cur].hidden = true;
    var pg = pages[i]; pg.hidden = false; pg.scrollTop = 0;
    pg.classList.remove('enter-r', 'enter-l'); void pg.offsetWidth;
    if (dir) pg.classList.add(dir > 0 ? 'enter-r' : 'enter-l');
    cur = i;
    $('#count').textContent = (i + 1) + ' / ' + pages.length;
    $('#prev').disabled = i === 0; $('#next').disabled = i === pages.length - 1;
    $('#progB').style.width = (i / (pages.length - 1) * 100) + '%';
    var tot = $('#progT').dataset.total;
    $('#progT').textContent = pg.dataset.kind === 'item' ? (pages.indexOf(pg) - 1) + ' / ' + (pages.length - 3) + '쪽' : tot + '개의 질문';
    loadImages(pg);
    if (pages[i + 1]) loadImages(pages[i + 1]);
    store.set('wm-book-' + KEY, String(i));
    closeSheets();
  }
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-go]'); if (b) { var i = +b.dataset.go; go(i, i > cur ? 1 : -1); } });
  $('#prev').onclick = function () { go(cur - 1, -1); };
  $('#next').onclick = function () { go(cur + 1, 1); };
  document.addEventListener('keydown', function (e) { if (!pages.length) return; if (e.key === 'ArrowRight') go(cur + 1, 1); if (e.key === 'ArrowLeft') go(cur - 1, -1); });
  var sx = null, sy = null;
  book.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  book.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { dx < 0 ? go(cur + 1, 1) : go(cur - 1, -1); }
    sx = null;
  });

  function closeSheets() { ['#tocSheet', '#fontSheet'].forEach(function (s) { $(s).hidden = true; }); $('#tocBtn').setAttribute('aria-expanded', 'false'); $('#fontBtn').setAttribute('aria-expanded', 'false'); }
  function toggle(sheet, btn) { var open = $(sheet).hidden; closeSheets(); $(sheet).hidden = !open; $(btn).setAttribute('aria-expanded', String(open)); }
  $('#tocBtn').onclick = function () { toggle('#tocSheet', '#tocBtn'); };
  $('#fontBtn').onclick = function () { toggle('#fontSheet', '#fontBtn'); };
  function setFs(v) { document.documentElement.style.setProperty('--fs', v + 'px'); [].slice.call(document.querySelectorAll('.sizes button')).forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.fs == v)); }); store.set('wm-fs', v); }
  [].slice.call(document.querySelectorAll('.sizes button')).forEach(function (b) { b.onclick = function () { setFs(b.dataset.fs); }; });
  setFs(store.get('wm-fs') || 18);
