<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>위드메모리 · 사진 올리기</title>
<meta property="og:title" content="위드메모리 · 사진 올리기">
<meta property="og:description" content="사진 2장과 그 사진에 대한 이야기를 남겨 주세요.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<style>
:root{--white:#FFFFFF;--cream:#FBF5EE;--brown:#A0482C;--brown-dk:#8A3D24;--ink:#2B2622;--sub:rgba(43,38,34,.66);--line:rgba(43,38,34,.12);
 --accent:#A0482C;--soft:#FBF5EE;--rec:#A0482C}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;line-height:1.7;word-break:keep-all;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:32px 24px 64px}
.brand{font-size:14px;color:var(--brown);font-weight:600;letter-spacing:.04em;margin:0 0 16px}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:24px 16px;margin-bottom:16px}
h1{font-size:26px;line-height:1.45;font-weight:600;margin:0 0 8px}
p{margin:8px 0}
.note{font-size:16px;color:var(--sub);white-space:pre-line}
.who{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:16px;background:var(--cream);color:var(--brown);font-size:14px;font-weight:600;margin:0 0 16px}
.deadline{background:var(--cream);color:var(--brown);border-radius:8px;padding:16px;font-weight:600;font-size:16px;margin:16px 0 0}
.deadline small{display:block;font-weight:500;font-size:15px;margin-top:4px;color:var(--sub)}
.tips{margin:16px 0 0;padding:16px 16px 16px 32px;font-size:15px;line-height:1.6;color:var(--sub);background:var(--cream);border-radius:8px}
.tips li{margin:4px 0}
.prog{position:sticky;top:0;z-index:5;background:var(--white);padding:8px 0;margin:0 0 8px}
.prog-in{padding:0}
.prog-t{font-size:15px;font-weight:600;color:var(--brown);margin:0}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.6;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--brown)}
.locked{opacity:.4;pointer-events:none}
.ph-t{font-size:17px;font-weight:600;margin:0 0 16px}
.ph-t b{color:var(--brown);margin-right:4px;font-weight:600}
.pick{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;font-size:17px;font-weight:600;border-radius:8px;border:1px solid var(--brown);background:var(--brown);color:var(--white);cursor:pointer;font-family:inherit;text-align:center}
.pick.alt{background:var(--white);color:var(--brown)}
.pick.off{opacity:.4;pointer-events:none}
.pick input{display:none}
.prev{display:block;width:100%;max-height:360px;object-fit:contain;background:var(--cream);border-radius:8px;margin:16px 0 0}
.prev-cap{font-size:14px;color:var(--sub);margin:8px 0 0;text-align:center}
.state{font-size:16px;line-height:1.6;font-weight:500;margin:16px 0 0;white-space:pre-line;color:var(--sub)}
.state.ok{color:var(--brown);font-weight:600} .state.err{color:var(--brown);font-weight:600}
.warnbox{background:var(--cream);color:var(--brown);border-radius:8px;padding:12px 16px;font-size:14px;line-height:1.6;font-weight:600;margin:16px 0 0;white-space:pre-line}
.story{border-top:1px solid var(--line);margin-top:24px;padding-top:24px}
.story-t{font-size:16px;font-weight:600;margin:0}
.recbox{text-align:center;padding:16px 0 0}
.mic{width:80px;height:80px;border-radius:50%;border:1px solid var(--brown);background:var(--brown);color:var(--white);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.mic svg{width:32px;height:32px}
.mic.on{background:var(--white);color:var(--brown)}
.mic.on svg{width:28px;height:28px}
.mic:disabled{opacity:.4}
.lbl{font-size:16px;font-weight:600;color:var(--ink);margin:8px 0 0}
.lbl.on{color:var(--brown)}
.time{font-size:28px;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);min-height:0}
audio{width:100%;margin:16px 0 0}
.retry{margin-top:16px;height:48px;font-size:16px;padding:0 24px;border-radius:8px;border:1px solid var(--brown);background:var(--white);color:var(--brown);font-weight:600;font-family:inherit}
.hide{display:none}
.msg{font-weight:600;border-radius:8px;padding:12px 16px;margin:16px 0 0;font-size:15px;line-height:1.6}
.msg.info{background:var(--cream);color:var(--sub);font-weight:500}
.msg.err{background:var(--cream);color:var(--brown)}
.btn{flex:1;width:100%;height:56px;font-size:17px;font-weight:600;border-radius:8px;border:1px solid var(--brown);background:var(--white);color:var(--brown);cursor:pointer;font-family:inherit;margin-top:16px}
.btn.main{background:var(--brown);color:var(--white)}
.btn.main:active{background:var(--brown-dk)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}
.ov{position:fixed;inset:0;background:rgba(43,38,34,.48);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal{background:var(--white);border-radius:24px 24px 0 0;padding:32px 24px calc(24px + env(safe-area-inset-bottom));max-width:560px;width:100%}
.modal h2{font-size:22px;font-weight:600;margin:0 0 8px}
#slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
#slots>.card{padding:0 0 12px;margin:0;overflow:hidden}
#slots>.card>*{margin-left:12px;margin-right:12px}
#slots>.card>.pick{margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0;aspect-ratio:4/3;min-height:0;height:auto;background:var(--cream);color:var(--brown);flex-direction:column;gap:4px;position:relative;font-size:15px;padding:0}
#slots>.card>.pick:not(.alt) .pick-t::before{content:'+';display:block;font-size:28px;font-weight:400;line-height:1}
#slots>.card>.pick.alt .pick-t{position:absolute;right:8px;bottom:8px;height:32px;padding:0 12px;border-radius:16px;background:var(--white);font-size:13px;display:flex;align-items:center;border:1px solid var(--brown)}
#slots .prev{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;margin:0;border-radius:0}
#slots .tag{position:absolute;left:8px;top:8px;height:24px;padding:0 8px;border-radius:12px;background:var(--white);color:var(--ink);font-size:12px;font-weight:600;display:flex;align-items:center}
#slots .ph-t,#slots .prev-cap{display:none!important}
#slots .state{font-size:13px;line-height:1.5;margin-top:12px;text-align:left}
#slots .warnbox{font-size:12px;padding:8px;margin-top:8px}
#slots .retry{height:40px;font-size:14px;padding:0 12px;margin-top:8px;width:calc(100% - 24px)}
#slots .story{margin-top:12px;padding-top:12px}
#slots .story-t{font-size:14px}
#slots .story .note{font-size:12px;line-height:1.5;margin:4px 0 0}
#slots .recbox{padding-top:8px}
#slots .mic{width:56px;height:56px}
#slots .mic svg{width:24px;height:24px}
#slots .lbl{font-size:14px;margin-top:4px}
#slots .time{font-size:18px}
#slots audio{height:36px;margin-top:8px}
/* 사진 칸만 있는 페이지(손글씨만 + 사진 편) — 녹음 페이지와 같은 모양 */
body.solo .wrap{padding:0}
body.solo .brand{display:none}
.s-top{position:sticky;top:0;z-index:5;background:var(--white);padding-top:env(safe-area-inset-top)}
.s-bar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.s-back{width:48px;height:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer}
.s-cnt{font-size:15px;font-weight:600;color:var(--sub)}
.s-prog{height:4px;background:var(--cream);margin:0 24px;border-radius:2px;overflow:hidden}
.s-prog i{display:block;height:100%;width:100%;background:var(--brown);border-radius:2px}
.s-screen{padding:32px 24px 24px;min-height:calc(100vh - 160px)}
.s-eyebrow{font-size:15px;font-weight:600;color:var(--brown);margin:0}
.s-h{font-size:26px;line-height:1.45;font-weight:600;margin:8px 0 0;white-space:pre-line}
.s-d{font-size:16px;line-height:1.7;color:var(--sub);margin:16px 0 0;white-space:pre-line}
.s-who{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:16px;background:var(--cream);color:var(--brown);font-size:14px;font-weight:600;margin:0 0 16px}
.s-facts{margin-top:32px;border-top:1px solid var(--line)}
.s-fact{display:flex;justify-content:space-between;align-items:center;min-height:56px;border-bottom:1px solid var(--line);font-size:16px;gap:16px}
.s-fact b{font-weight:600;text-align:right}
.s-chk{margin-top:24px;display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--cream);border-radius:8px;font-size:16px;line-height:1.6;cursor:pointer}
.s-chk input{position:absolute;opacity:0;pointer-events:none}
.s-box{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--brown);background:var(--white);display:flex;align-items:center;justify-content:center;margin-top:1px}
.s-box svg{display:none}
.s-chk input:checked+.s-box{background:var(--brown)}
.s-chk input:checked+.s-box svg{display:block}
.s-note{font-size:14px;line-height:1.6;color:var(--sub);margin:16px 0 0}
.s-tip{margin:24px 0 16px;padding:12px 16px;background:var(--cream);border-radius:8px;font-size:14px;line-height:1.6;color:var(--sub)}
.s-foot{position:sticky;bottom:0;background:var(--white);padding:12px 24px calc(16px + env(safe-area-inset-bottom))}
.s-foot .btn{margin-top:0}
.s-msg{white-space:pre-line;font-size:15px;line-height:1.6;font-weight:600;color:var(--brown);background:var(--cream);border-radius:8px;padding:12px 16px;margin:0 0 12px}
.s-sum{margin:24px 0;border-top:1px solid var(--line)}
.s-sum div{display:flex;justify-content:space-between;gap:16px;min-height:52px;align-items:center;border-bottom:1px solid var(--line);font-size:16px}
.s-sum b{font-weight:600;text-align:right}
.s-sum .warn,.s-sum .warn b{color:var(--brown);font-weight:600}
.s-end{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:96px 32px;min-height:80vh}
.s-ck{width:88px;height:88px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--brown)}
.s-end h1{margin:32px 0 0}
.s-card{margin-top:40px;width:100%;border:1px solid var(--line);border-radius:8px;padding:16px;text-align:left;font-size:15px;line-height:1.7}
.s-card b{font-weight:600}
body.embed{background:transparent}
body.embed .wrap{padding:0 0 8px}
body.embed .brand,body.embed .prog{display:none}
body.embed #app > .card:first-child h1,body.embed #app > .card:first-child > .note{display:none}
body.embed #app > .card:first-child{border:0;padding:0;margin:0 0 16px}
body.embed #app > .card:first-child .tips{margin-top:0}
</style>

<div class="wrap">
  <p class="brand">WITH MEMORY · 위드메모리</p>
  <div id="app"><div class="ux-skw" role="status" aria-label="불러오는 중"><span class="ux-sk h"></span><span class="ux-sk l"></span><span class="ux-sk s"></span><span class="ux-sk b"></span><span class="ux-sk btn"></span><p>불러오는 중이에요. 처음 여는 데는 몇 초 걸릴 수 있어요.</p></div></div>
</div>

<script>
(function () {
  // ▼ 사진용 Apps Script 웹 앱 주소(/exec)를 넣으세요 (녹음용 주소와 다릅니다)
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbz9qdMiTEWVgzacdUL7U5Qs-VLrOz4ntncfHK34TKyi3HbHy_OZ848Z7UCZyqlPewIdPQ/exec';
  var MAX_FILE = 30 * 1024 * 1024;   // 사진 원본 30MB까지
  var SMALL_PX = 1500;               // 긴 변이 이보다 작으면 화질 안내
  var CONFIRM_TEXT = '올린 사진과 이야기가 책으로 만들어지는 데 사용되는 것을 확인했습니다.';
  var MIC_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
  var STOP_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var app = $('#app');
  var token = (new URLSearchParams(location.hash.slice(1))).get('t') || (new URLSearchParams(location.search)).get('t') || '';
  var info = null, active = null, MAX_SECS = 60;
  var ctl = {};          // 사진 칸별 화면 요소
  var pp = {};           // 사진 올리기 진행 상태 (칸별)
  var ps = {};           // 이야기 올리기 진행 상태 (칸별)
  var prog = null;
  var EMBED = /[?&#]embed=1/.test(location.href);   // 녹음 페이지 맨 아래에 들어간 사진 칸 (확인·제출은 녹음 페이지가 함께 함)
  if (EMBED) document.body.classList.add('embed');

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmt(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function dl(ms) { var d = new Date(ms + 9 * 3600 * 1000); return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일 ' + ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2); }
  function slotOf(n) { return info.saved[n] || (info.saved[n] = {}); }
  function isRec() { return info.mode !== '손글씨'; }

  // 마이크 오류 안내 — 기기에 맞는 방법 한 줄만 보여 줌
  function micHelp(e) {
    var nm = e && e.name, ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua), kakao = /KAKAOTALK/i.test(ua);
    if (nm === 'NotAllowedError' || nm === 'PermissionDeniedError')
      return '마이크 사용이 막혀 있습니다. 휴대폰 설정 → 앱 목록에서 ' + (kakao ? '카카오톡' : '사용하시는 인터넷 앱') + ' → 마이크를 켠 뒤 이 페이지를 다시 열어 주세요.';
    if (nm === 'NotFoundError') return '마이크를 찾지 못했습니다. 이어폰을 빼고 다시 눌러 주세요.';
    if (nm === 'NotReadableError') return '다른 앱이 마이크를 쓰고 있습니다. 통화나 다른 녹음을 끝낸 뒤 눌러 주세요.';
    return '녹음을 시작하지 못했습니다. ' + (kakao
      ? (ios ? "화면 아래 공유 버튼 → 'Safari로 열기'를 눌러 다시 열어 주세요." : "오른쪽 위 ⋮ → '다른 브라우저로 열기'를 눌러 다시 열어 주세요.")
      : '페이지를 새로고침한 뒤 다시 눌러 주세요. 계속 안 되면 카카오톡 채널로 알려 주세요.');
  }
  function call(body) {
    body.t = token;
    return fetch(EXEC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }
  function toB64(blob) {
    return new Promise(function (ok, no) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { no(r.error); };
      r.readAsDataURL(blob);
    });
  }
  function pickMime() {
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    var list = ['audio/mp4;codecs=mp4a.40.2', 'audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < list.length; i++) if (MediaRecorder.isTypeSupported(list[i])) return list[i];
    return '';
  }

  function simple(title, body, done) {
    app.textContent = '';
    if (EMBED) { var c = el('div', 'card'); c.appendChild(el('h1', '', title)); if (body) c.appendChild(el('p', '', body)); app.appendChild(c); return; }
    document.body.classList.add('solo');
    var w = el('div', 's-end');
    if (done) { var k = el('span', 's-ck'); k.innerHTML = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>'; w.appendChild(k); }
    w.appendChild(el('h1', '', title));
    if (body) w.appendChild(el('p', 's-d', body));
    if (done) { var cd = el('div', 's-card'); cd.appendChild(el('b', '', '이렇게 이어져요')); cd.appendChild(el('br')); cd.appendChild(document.createTextNode('올려 주신 사진은 속지로 정리해 ' + (info && info.name ? info.name + '님께' : '신청하신 분께') + ' 보내 드려요.')); w.appendChild(cd); }
    app.appendChild(w);
    window.scrollTo(0, 0);
  }

  function start() {
    if (!token) return simple('주소를 확인해 주세요', '받으신 링크를 다시 눌러 주세요.');
    call({ action: 'info' }).then(function (r) {
      if (!r.ok && r.code === 'server') return simple('잠시 문제가 생겼습니다', '잠시 문제가 생겼습니다. 1~2분 뒤 새로고침해 주세요. 계속 안 되면 카카오톡 채널로 알려 주세요.');
      if (!r.ok) return simple('열 수 없는 주소입니다', '받으신 링크가 맞는지 확인해 주세요. 계속 열리지 않으면 신청하신 분께 문의해 주세요.');
      info = r; info.saved = info.saved || {}; MAX_SECS = r.storySecs || 60;
      if (EMBED && r.state !== 'open') { info = r; window.wmPhoto = { done: true }; return simple(r.state === 'submitted' ? '사진은 제출되었습니다' : '사진을 올리는 기간이 끝났습니다', ''); }
      if (r.state === 'submitted') return simple('제출이 완료되었습니다', '사진이 전달되었습니다. 감사합니다.', true);
      if (r.state !== 'open') return simple('사진을 올리는 기간이 끝났습니다', '올리신 사진과 이야기는 책을 만드는 데 사용됩니다. 문의가 필요하시면 신청하신 분께 말씀해 주세요.');
      render();
    }).catch(function () { simple('불러오지 못했습니다', '인터넷 연결을 확인한 뒤 새로고침해 주세요.'); });
  }

  function render() {
    if (!EMBED) return renderSolo();
    app.textContent = '';
    var head = el('div', 'card');
    if (info.who && !EMBED) head.appendChild(el('p', 'who', info.who + ' 사진 링크'));
    head.appendChild(el('h1', '', EMBED ? '사진 올리기' : (info.name ? info.name + '님이 ' : '') + '신청하신 사진'));
    head.appendChild(el('p', 'note', isRec()
      ? '간직해 오신 사진을 ' + info.max + '장까지 올려 주세요.\n사진마다 그 사진에 대한 이야기를 ' + (MAX_SECS / 60) + '분 안으로 들려주시면, 사진 아래에 그 이야기가 글로 담깁니다.'

        : '녹음이 되지 않으면 오른쪽 위 ⋮ 버튼에서 "다른 브라우저로 열기"를 선택해 주세요.'));

    foot.appendChild(fm); foot.appendChild(bSub);
    bSub.addEventListener('click', function () { askSubmit(fm); });
    if (!EMBED) app.appendChild(foot);

    function open() { list.classList.remove('locked'); foot.classList.remove('locked'); }
    if (info.confirmed) { cb.checked = true; cb.disabled = true; open(); }
    cb.addEventListener('change', function () {
      if (!cb.checked) return;

      call({ action: 'confirm' }).then(function (r) {
        if (r.ok) open(); else if (r.code === 'closed' || r.code === 'submitted') location.reload(); else { cb.checked = false; cb.disabled = false; alert('확인을 저장하지 못했습니다. 다시 눌러 주세요.'); }
      }).catch(function () { cb.checked = false; cb.disabled = false; alert('인터넷 연결을 확인한 뒤 다시 눌러 주세요.'); });

  /* 사진 칸만 있는 페이지: 시작 화면 → 사진 화면, 아래 고정 버튼 하나 (녹음 페이지와 같은 흐름) */
  function renderSolo() {

    intro.appendChild(el('p', 's-d', isRec()

      : '간직해 온 사진을 ' + info.max + '장까지 올려 주세요. 사진에 대한 이야기는 함께 받으신 기록지의 사진 이야기 칸에 적어 주세요.'));

    fact('사진', info.max + '장');

    fact('마감', dl(info.deadline));

    lb.appendChild(cb); lb.appendChild(box); lb.appendChild(el('span', '', '올려 주신 사진' + (isRec() ? '과 이야기' : '') + '가 책으로 만들어지는 데 쓰이는 것을 확인했어요.'));

    intro.appendChild(el('p', 's-note', '제출하기 전까지는 다른 사진으로 바꿀 수 있어요. 제출을 누르지 않으셔도 마감 때 마지막으로 올린 사진이 전달돼요.'));
    app.appendChild(intro);

    // 사진 화면
    var shot = el('div', 's-screen hide');
    shot.appendChild(el('p', 's-eyebrow', '사진 고르기'));
    shot.appendChild(el('p', 's-h', '간직해 온 사진\n' + info.max + '장을 골라 주세요'));
    shot.appendChild(el('p', 's-tip', '가로 사진이 가장 잘 담겨요. 카카오톡으로 받은 사진보다 사진첩 원본이 선명해요. 종이 사진은 밝은 곳에서 그림자 없이 꽉 차게 찍어 주세요.'));
    var list = el('div'); list.id = 'slots';
    for (var n = 1; n <= info.max; n++) list.appendChild(buildSlot(n));
    shot.appendChild(list);
    app.appendChild(shot);

    var foot = el('div', 's-foot');
    var fm = el('p', 's-msg hide');

      btn.disabled = i === 0 && !cb.checked;

    cb.addEventListener('change', function () { if (step === 0) btn.disabled = !cb.checked; });
    back.addEventListener('click', function () { if (active === null) show(0); });
    btn.addEventListener('click', function () {
      if (step === 1) return askSubmit(fm);
      if (!cb.checked) return;
      if (info.confirmed) return show(1);
      btn.disabled = true;

      }).catch(function () { btn.disabled = false; say(fm, '인터넷 연결을 확인한 뒤 다시 눌러 주세요.'); });

  // 제출 전 확인: 진행 중·실패한 것이 있는지, 올린 사진 수, 이야기가 빠진 사진 번호
  function photoCheck() {
    var c = { busy: active !== null, failed: false, ph: 0, noStory: [] };
    for (var n = 1; n <= info.max; n++) {
      if (busyP(n) || busyS(n)) c.busy = true;
      if ((pp[n] && pp[n].status === 'failed') || (ps[n] && ps[n].status === 'failed')) c.failed = true;
      var s = info.saved[n] || {};
      if (s.photo) { c.ph++; if (isRec() && !s.story) c.noStory.push(n); }
    }
    return c;
  }

  function say(fm, text) { fm.textContent = text; fm.className = EMBED ? 'msg err' : 's-msg'; }
  function askSubmit(fm) {
    var c = photoCheck(), noStory = c.noStory;
    if (c.busy) return say(fm, '사진 올리기 또는 이야기 녹음이 진행 중이에요.\n끝난 뒤에 눌러 주세요.');
    if (c.failed) return say(fm, '올라가지 않은 사진이나 이야기가 있어요. 사진 칸에서 "다시 올리기"를 눌러 주세요.');

    var line = function (k, v, warn) { var d = el('div', warn ? 'warn' : ''); d.appendChild(el('span', '', k)); d.appendChild(el('b', '', v)); sum.appendChild(d); };
    line('사진', c.ph + ' / ' + info.max);
    if (noStory.length) line('이야기가 없는 사진', '사진 ' + noStory.join(', '), true);
    m.appendChild(sum);
    var row = el('div', 'row');

    var yes = el('button', 'btn main', '제출하기'); yes.type = 'button';
    row.appendChild(no); row.appendChild(yes); m.appendChild(row);

    no.addEventListener('click', function () { ov.remove(); });
    yes.addEventListener('click', function () {
      yes.disabled = true; no.disabled = true; yes.textContent = '제출하는 중…';
      call({ action: 'submit' }).then(function (r) {
        ov.remove();
        if (r.ok || r.code === 'submitted') simple('제출이 끝났어요', '소중한 사진 보내 주셔서 고맙습니다.', true);
        else if (r.code === 'closed') location.reload();
        else if (r.code === 'no_photo') say(fm, '사진을 한 장 이상 올린 뒤 제출해 주세요.');
        else if (r.code === 'not_confirmed') say(fm, '첫 화면의 확인 칸에 체크해 주세요.');
        else say(fm, '제출하지 못했습니다. 잠시 후 다시 눌러 주세요.');
      }).catch(function () { ov.remove(); say(fm, '제출하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요.'); });
    });
  }

  function updateProg() {
    if (!prog) return;
    var ph = 0, st = 0;
    for (var n = 1; n <= info.max; n++) { var s = info.saved[n] || {}; if (s.photo) ph++; if (s.story) st++; }
    prog.textContent = '사진 ' + info.max + '장 중 ' + ph + '장 올림' + (isRec() ? ' · 이야기 ' + st + '개 녹음' : '');
  }

  // ───── 사진 칸 ─────
  function buildSlot(n) {
    var card = el('div', 'card');
    var t = el('p', 'ph-t'); t.appendChild(el('b', '', '사진 ' + n + '.')); card.appendChild(t);

    var pick = el('label', 'pick');
    var img = el('img', 'prev hide'); img.alt = '고르신 사진 ' + n;
    var pickTxt = el('span', 'pick-t', '사진 고르기');
    var input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
    pick.appendChild(img); pick.appendChild(el('span', 'tag', '사진 ' + n)); pick.appendChild(pickTxt); pick.appendChild(input);
    card.appendChild(pick);
    var cap = el('p', 'prev-cap hide', '방금 고르신 사진입니다. 이 화면을 닫으면 다시 보이지 않습니다.');
    var pstate = el('p', 'state');
    var warn = el('p', 'warnbox hide');
    var pretry = el('button', 'retry hide', '다시 올리기'); pretry.type = 'button';
    card.appendChild(cap); card.appendChild(pstate); card.appendChild(warn); card.appendChild(pretry);

    var c = { pick: pick, pickTxt: pickTxt, input: input, img: img, cap: cap, pstate: pstate, warn: warn, pretry: pretry };

    var story = el('div', 'story');
    story.appendChild(el('p', 'story-t', '사진 이야기'));
    if (isRec()) {
      story.appendChild(el('p', 'note', '언제, 어디서, 왜 고르셨는지 ' + (MAX_SECS / 60) + '분 안으로 들려주세요.'));
      var box = el('div', 'recbox');
      var mic = document.createElement('button'); mic.type = 'button'; mic.className = 'mic';
      var lbl = el('p', 'lbl'); var sstate = el('p', 'state'); var time = el('p', 'time');
      var audio = document.createElement('audio'); audio.controls = true; audio.setAttribute('playsinline', ''); audio.className = 'hide';
      var sretry = el('button', 'retry hide', '다시 저장하기'); sretry.type = 'button';
      box.appendChild(mic); box.appendChild(lbl); box.appendChild(sstate); box.appendChild(time); box.appendChild(audio); box.appendChild(sretry);
      story.appendChild(box);
      c.mic = mic; c.lbl = lbl; c.sstate = sstate; c.time = time; c.audio = audio; c.sretry = sretry;
      mic.addEventListener('click', function () { toggle(n); });
      sretry.addEventListener('click', function () { uploadStory(n); });
    } else {
      story.appendChild(el('p', 'note', '이야기는 함께 받으신 기록지의 사진 이야기 칸에 적어 주세요.'));
    }
    card.appendChild(story);
    ctl[n] = c;

    var s = info.saved[n] || {};
    if (s.photo) setP(n, '올린 사진이 있어요 (' + s.photo.when + ')', 'ok');
    if (isRec()) {
      if (s.story) setS(n, '이야기 ' + fmt(s.story.secs) + ' 저장됨', 'ok');
      setMic(n, false);
    }
    input.addEventListener('change', function () { var f = input.files && input.files[0]; input.value = ''; if (f) onPick(n, f); });
    pretry.addEventListener('click', function () { uploadPhoto(n); });
    return card;
  }

  function setP(n, text, kind) { var s = ctl[n].pstate; s.textContent = text; s.className = 'state ' + (kind || ''); }
  function setS(n, text, kind) { var s = ctl[n].sstate; if (!s) return; s.textContent = text; s.className = 'state ' + (kind || ''); }
  function setMic(n, on) {
    var c = ctl[n]; if (!c.mic) return;
    var s = info.saved[n] || {};
    c.mic.innerHTML = on ? STOP_SVG : MIC_SVG;
    c.mic.classList.toggle('on', on);
    c.mic.setAttribute('aria-label', '사진 ' + n + (on ? ' 이야기 녹음 끝내기' : ' 이야기 녹음'));
    c.lbl.textContent = on ? '녹음 끝내기' : (s.story ? '다시 녹음' : '이야기 녹음');
    c.lbl.className = 'lbl' + (on ? ' on' : '');
    if (!on && !s.photo && !s.story && !(ps[n] && ps[n].status !== 'saved')) setS(n, '사진을 고르면 녹음할 수 있어요', '');
    else if (!on && s.photo && !s.story && !ps[n]) setS(n, '', '');
  }
  function busyP(n) { return !!pp[n] && (pp[n].status === 'uploading' || pp[n].status === 'checking'); }
  function busyS(n) { return !!ps[n] && (ps[n].status === 'uploading' || ps[n].status === 'checking'); }
  // 녹음 중에는 다른 버튼을 잠그고, 올리는 중인 칸은 끝날 때까지 잠근다 (늦게 도착한 이전 것이 덮어쓰지 않게)
  function syncAll() {
    for (var n = 1; n <= info.max; n++) {
      var c = ctl[n], s = info.saved[n] || {};
      c.pick.classList.toggle('off', active !== null || busyP(n));
      c.input.disabled = active !== null || busyP(n);
      c.pickTxt.textContent = s.photo ? '사진 바꾸기' : '사진 고르기';
      c.pick.classList.toggle('alt', !!s.photo);
      if (c.mic) c.mic.disabled = !s.photo || (active !== null && active !== n) || busyS(n) || busyP(n);
    }
    updateProg();
  }

  function onPick(n, f) {
    var c = ctl[n];
    c.warn.classList.add('hide'); c.pretry.classList.add('hide');
    var ext = (String(f.name || '').match(/\.([a-z0-9]{2,5})$/i) || [])[1] || '';
    var isImg = /^image\//.test(f.type) || /^(jpe?g|png|heic|heif|webp|gif)$/i.test(ext);
    if (!isImg) return setP(n, '사진 파일만 올릴 수 있습니다. 사진첩에서 골라 주세요.', 'err');
    if (f.size > MAX_FILE) return setP(n, '사진이 너무 큽니다(30MB 초과). 다른 사진을 골라 주세요.', 'err');
    var url = URL.createObjectURL(f);
    var p = { file: f, mime: f.type || '', ext: ext, w: 0, h: 0, at: Date.now(), status: 'new' };
    pp[n] = p;
    var im = new Image();
    im.onload = function () {
      p.w = im.naturalWidth; p.h = im.naturalHeight;
      c.img.src = url; c.img.classList.remove('hide'); c.cap.classList.remove('hide');
      cleanPhoto(im, p).then(function () { if (pp[n] === p) uploadPhoto(n); });
    };
    im.onerror = function () {   // 미리보기를 못 하는 형식(일부 HEIC)도 원본 그대로 올림
      c.img.classList.add('hide'); c.cap.classList.add('hide');
      uploadPhoto(n);
    };
    im.src = url;
  }

  // 올리기 전에 사진을 JPG로 바꾸면서 위치 정보 등 부가 정보를 지움 (HEIC도 휴대폰이 열 수 있으면 JPG로).
  // 너무 큰 사진은 휴대폰 브라우저 한도(약 1,600만 화소) 안으로 줄임. 실패하면 원본 그대로 올림
  function cleanPhoto(im, p) {
    return new Promise(function (ok) {
      try {
        var w = im.naturalWidth, h = im.naturalHeight;
        if (!w || !h) return ok();
        var s = Math.min(1, 2400 / Math.max(w, h), Math.sqrt(16000000 / (w * h))), cw = Math.round(w * s), ch = Math.round(h * s);
        var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
        var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cw, ch); cx.drawImage(im, 0, 0, cw, ch);
        cv.toBlob(function (b) {
          if (b && b.size > 1000) { p.file = b; p.mime = 'image/jpeg'; p.ext = 'jpg'; p.w = cw; p.h = ch; }
          ok();
        }, 'image/jpeg', 0.9);
      } catch (e) { ok(); }
    });
  }  
  function uploadPhoto(n) {
    var p = pp[n]; if (!p || busyP(n)) return;
    var c = ctl[n];
    p.status = 'uploading'; c.pretry.classList.add('hide');
    syncAll();
    setP(n, '올리는 중이에요…\n화면을 닫지 말아 주세요.', '');
    toB64(p.file).then(function (data) {
      return call({ action: 'photo', slot: n, data: data, mime: p.mime, ext: p.ext, w: p.w, h: p.h, at: p.at });
    }).then(function (res) {
      if (pp[n] !== p) return;
      if (res.ok) {
        var s = slotOf(n);
        if (res.stale) { if (res.photo) s.photo = res.photo; }
        else s.photo = { when: res.when, at: p.at, w: p.w, h: p.h };
        p.status = 'saved';
        photoDone(n, p);
      } else if (res.code === 'closed') {
        location.reload();
      } else if (res.code === 'too_big') {
        p.status = 'failed'; setP(n, '사진이 너무 큽니다. 다른 사진을 골라 주세요.', 'err'); syncAll();
      } else if (res.code === 'not_image') {
        p.status = 'failed'; setP(n, '사진 파일만 올릴 수 있습니다. 사진첩에서 골라 주세요.', 'err'); syncAll();
      } else if (res.code === 'not_confirmed') {
        p.status = 'failed'; setP(n, '첫 화면의 확인 칸에 체크해 주세요.', 'err'); syncAll();
      } else failP(n, p);
    }).catch(function () { failP(n, p); });
  }
  function photoDone(n, p) {
    var c = ctl[n], s = slotOf(n);
    var text = '잘 올라갔어요';
    if (isRec() && s.story) text += '\n사진을 바꾸셨다면 이야기도 다시 녹음해 주세요.';
    setP(n, text, 'ok');
    var big = Math.max(p.w || 0, p.h || 0);
    var tall = p.w && p.h && p.h > p.w * 1.05;
    var msgs = [];
    if (big && big < SMALL_PX) msgs.push('작은 사진이라 흐릿하게 인화될 수 있어요. 사진첩 원본이 있으면 바꿔 주세요.');
    if (tall) msgs.push('세로 사진이에요. 가로 사진이 더 잘 담겨요.');
    if (msgs.length) { c.warn.textContent = msgs.join('\n\n'); c.warn.classList.remove('hide'); }
    else c.warn.classList.add('hide');
    setMic(n, false); syncAll();
  }
  function failP(n, p) {
    if (p.status === 'saved') return;
    p.status = 'checking'; syncAll();
    setP(n, '올라갔는지 확인하고 있어요…', '');
    call({ action: 'info' }).then(function (r) {
      if (pp[n] !== p) return;
      if (r && r.ok) {
        info.saved = r.saved || {};
        var s = info.saved[n];
        if (s && s.photo && s.photo.at === p.at) { p.status = 'saved'; photoDone(n, p); return; }
      }
      showFailP(n, p);
    }).catch(function () { if (pp[n] === p) showFailP(n, p); });
  }
  function showFailP(n, p) {
    p.status = 'failed';
    setP(n, '올리지 못했어요. 인터넷 연결을 확인한 뒤 아래 버튼을 눌러 주세요.', 'err');
    ctl[n].pretry.classList.remove('hide');
    syncAll();
  }

  // ───── 이야기 녹음 (1분) ─────
  var rec = null, stream = null, chunks = [], t0 = 0, timer = null, interrupted = false, capped = false, warned = false, muteTimer = null, wake = null;

  function keepAwake(on) {
    try {
      if (on && navigator.wakeLock && !wake) {
        navigator.wakeLock.request('screen').then(function (w) {
          if (active === null) { w.release().catch(function () {}); return; }
          wake = w; w.addEventListener('release', function () { wake = null; });
        }).catch(function () {});
      }
      if (!on && wake) { wake.release().catch(function () {}); wake = null; }
    } catch (e) {}
  }

  function toggle(n) {
    if (active === n) return stop();
    if (active !== null || busyS(n) || busyP(n)) return;
    if (!(info.saved[n] && info.saved[n].photo)) return;
    startRec(n);
  }

  function startRec(n) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      return setS(n, micHelp(null), 'err');
    }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function (s) {
      stream = s; chunks = [];
      var m = pickMime();
      rec = m ? new MediaRecorder(s, { mimeType: m }) : new MediaRecorder(s);
      rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
      rec.onstop = function () { finish(n); };
      interrupted = false; capped = false; warned = false;
      var tr = s.getAudioTracks()[0];
      if (tr) {
        tr.addEventListener('ended', function () { if (active === n) { interrupted = true; stop(); } });
        tr.addEventListener('mute', function () { clearTimeout(muteTimer); muteTimer = setTimeout(function () { if (active === n && tr.muted) { interrupted = true; stop(); } }, 3000); });
        tr.addEventListener('unmute', function () { clearTimeout(muteTimer); });
      }
      rec.start(1000);
      active = n; t0 = Date.now();
      syncAll(); keepAwake(true); setMic(n, true);
      var c = ctl[n];
      c.audio.classList.add('hide'); c.sretry.classList.add('hide');
      setS(n, '다 말씀하셨으면 다시 눌러 주세요.', '');
      c.time.textContent = '0:00';
      timer = setInterval(function () {
        var s2 = Math.floor((Date.now() - t0) / 1000);
        c.time.textContent = fmt(Math.min(s2, MAX_SECS));
        if (s2 >= MAX_SECS - 10 && !warned) { warned = true; setS(n, '10초 남았습니다.\n' + (MAX_SECS / 60) + '분이 되면 녹음이 자동으로 멈추고 저장됩니다.', 'err'); }
        if (s2 >= MAX_SECS) { capped = true; stop(); }
      }, 250);
    }).catch(function (e) {
      setS(n, micHelp(e), 'err');
    });
  }

  function stop() { clearInterval(timer); clearTimeout(muteTimer); if (rec && rec.state !== 'inactive') rec.stop(); }

  function finish(n) {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    var mime = (rec && rec.mimeType) || (chunks[0] && chunks[0].type) || 'audio/webm';
    var blob = new Blob(chunks, { type: mime });
    var secs = Math.min(MAX_SECS, Math.max(1, Math.round((Date.now() - t0) / 1000)));
    active = null; keepAwake(false);
    var c = ctl[n];
    c.time.textContent = '';
    c.audio.src = URL.createObjectURL(blob); c.audio.classList.remove('hide');
    ps[n] = { blob: blob, mime: mime, secs: secs, at: Date.now(), status: 'new', capped: capped, warn: interrupted || blob.size < secs * 3000 };
    setMic(n, false);
    uploadStory(n);
  }

  function uploadStory(n) {
    var p = ps[n]; if (!p || busyS(n)) return;
    var c = ctl[n];
    p.status = 'uploading'; c.sretry.classList.add('hide');
    syncAll();
    setS(n, '저장하는 중이에요…', '');
    toB64(p.blob).then(function (data) {
      return call({ action: 'story', slot: n, data: data, mime: p.mime, secs: p.secs, at: p.at });
    }).then(function (res) {
      if (ps[n] !== p) return;
      if (res.ok) {
        var s = slotOf(n);
        s.story = res.stale && res.story ? res.story : { secs: p.secs, at: p.at };
        p.status = 'saved'; storyDone(n, res.stale ? { secs: s.story.secs } : p);
      } else if (res.code === 'closed') {
        location.reload();
      } else if (res.code === 'not_confirmed' || res.code === 'no_photo') {
        p.status = 'failed'; setS(n, res.code === 'no_photo' ? '사진을 먼저 올린 뒤 이야기를 녹음해 주세요.' : '첫 화면의 확인 칸에 체크해 주세요.', 'err'); syncAll();
      } else failS(n, p);
    }).catch(function () { failS(n, p); });
  }
  function storyDone(n, p) {
    if (p.warn) setS(n, '녹음이 끊겼습니다.\n음악·영상 앱을 끄고 다시 녹음해 주세요.', 'err');
    else if (p.capped) setS(n, (MAX_SECS / 60) + '분이 되어 멈추고 저장됐어요 (' + fmt(p.secs) + ')', 'ok');
    else setS(n, '이야기 ' + fmt(p.secs) + ' 저장됨', 'ok');
    ctl[n].sretry.classList.add('hide');
    setMic(n, false); syncAll();
  }
  function failS(n, p) {
    if (p.status === 'saved') return;
    p.status = 'checking'; syncAll();
    setS(n, '저장됐는지 확인하고 있어요…', '');
    call({ action: 'info' }).then(function (r) {
      if (ps[n] !== p) return;
      if (r && r.ok) {
        info.saved = r.saved || {};
        var s = info.saved[n];
        if (s && s.story && s.story.at === p.at) { p.status = 'saved'; storyDone(n, p); return; }
      }
      showFailS(n, p);
    }).catch(function () { if (ps[n] === p) showFailS(n, p); });
  }
  function showFailS(n, p) {
    p.status = 'failed';
    setS(n, '저장하지 못했어요. 아래 버튼을 눌러 주세요.', 'err');
    ctl[n].sretry.classList.remove('hide');
    syncAll();
  }

  function busy() {
    if (active !== null) return true;
    for (var n = 1; info && n <= info.max; n++) if (busyP(n) || busyS(n)) return true;
    return false;
  }
  // 화면이 다시 보일 때: 올리던 사진·이야기가 서버에 들어갔는지 확인해서 화면을 맞춘다
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !info || !prog) return;
    var wait = false;
    for (var n = 1; n <= info.max; n++) if ((pp[n] && pp[n].status === 'uploading') || (ps[n] && ps[n].status === 'uploading')) wait = true;
    if (!wait) return;
    call({ action: 'info' }).then(function (r) {
      if (!r || !r.ok) return;
      info.saved = r.saved || {};
      for (var n = 1; n <= info.max; n++) {
        var s = info.saved[n] || {};
        if (pp[n] && pp[n].status === 'uploading' && s.photo && s.photo.at === pp[n].at) { pp[n].status = 'saved'; photoDone(n, pp[n]); }
        if (ps[n] && ps[n].status === 'uploading' && s.story && s.story.at === ps[n].at) { ps[n].status = 'saved'; storyDone(n, ps[n]); }
      }
      syncAll();
    }).catch(function () {});
  });
  window.addEventListener('beforeunload', function (e) { if (busy()) { e.preventDefault(); e.returnValue = ''; } });
  start();
})();
</script>
<script src="ux.js"></script>
</body>
</html>
